name: Update visitor statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Fetch GoatCounter statistics
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: |
          set -eu
          api="https://bazinga.goatcounter.com/api/v0"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          auth=(-H "Authorization: Bearer ${GOATCOUNTER_API_TOKEN}" -H "Content-Type: application/json")
          fetch() {
            curl --fail --silent --show-error --http1.1 \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              "${auth[@]}" "$1"
          }
          total="$(fetch "$api/stats/total?start=1970-01-01T00:00:00Z&end=$end")"
          locations="$(fetch "$api/stats/locations?start=1970-01-01T00:00:00Z&end=$end&limit=100")"
          jq -n --arg updated "$end" --argjson total "$total" --argjson locations "$locations" '
            {
              updated_at: $updated,
              total: ($total.total // 0),
              countries: (($locations.stats // [])
                | map(select(.id != "" and (.count // 0) > 0)
                  | {id: .id, name: .name, count: .count})
                | sort_by(-.count))
            }
          ' > static/data/visitor-stats.json

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/visitor-stats.json
          git diff --cached --quiet || git commit -m "Update visitor statistics"
          git push
